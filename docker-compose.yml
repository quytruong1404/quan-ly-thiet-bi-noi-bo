version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL 8.0
  mysql-db:
    image: mysql:8.0
    container_name: thiet_bi_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: thiet_bi_noi_bo
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - device-network

  # 2. Máy chủ REST API Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thiet_bi_backend
    restart: always
    depends_on:
      - mysql-db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/thiet_bi_noi_bo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - device-network

  # 3. Giao diện người dùng Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thiet_bi_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    networks:
      - device-network

networks:
  device-network:
    driver: bridge

volumes:
  mysql-data:
